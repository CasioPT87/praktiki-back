version: '3.8'

services:
  app:
    container_name: glossa_server
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3022:3022'
    command: npm run dev
    environment:
      - DATABASE_URL=postgres://user:password@db:5422/mydatabase
      - REDIS_URL=redis://redis:6322
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src

  db:
    container_name: postgres_db
    image: postgres:latest
    environment:
      POSTGRES_USER: serch_dev
      POSTGRES_PASSWORD: silvio_vive_dev
      POSTGRES_DB: glossa_dev
    ports:
      - '5422:5432'
    volumes:
      - praktiki_db_pg:/var/lib/postgresql/data

  redis:
    container_name: redis_service
    command: redis-server --loglevel warning --requirepass PrakTiki34!
    image: redis:6.2-alpine
    ports:
      - '6379:6379'

volumes:
  praktiki_db_pg:
  redis_data:
