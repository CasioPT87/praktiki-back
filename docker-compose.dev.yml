version: '3.8'

services:
  app:
    container_name: glossa_server
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3022:3022'
    command: npm run dev
    environment:
      - DATABASE_URL=postgres://user:password@db:5422/mydatabase
      - REDIS_URL=redis://redis:6322
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src

  db:
    container_name: postgres_db
    image: postgres:latest
    environment:
      POSTGRES_USER: serch_dev
      POSTGRES_PASSWORD: silvio_vive_dev
      POSTGRES_DB: glossa_dev
    ports:
      - '5422:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: redis_service
    image: redis:latest
    ports:
      - '6322:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
